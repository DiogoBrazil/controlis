[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/security",
    "crates/storage",
    "crates/codec",
    "crates/capture",
    "crates/input",
    "crates/transport",
    "crates/session-host",
    "crates/session-viewer",
    "crates/wayland-portal",
    "apps/controlis",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/controlis/controlis"

[workspace.dependencies]
# Internal crates
protocol = { path = "crates/protocol" }
security = { path = "crates/security" }
storage = { path = "crates/storage" }
codec = { path = "crates/codec" }
capture = { path = "crates/capture" }
input = { path = "crates/input" }
transport = { path = "crates/transport" }
session-host = { path = "crates/session-host" }
session-viewer = { path = "crates/session-viewer" }
wayland-portal = { path = "crates/wayland-portal" }

# Async runtime
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }

# Transport / TLS
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
sha2 = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1", features = ["use-std"] }

# Screen capture / input injection
xcap = "0.9"
enigo = "0.6"

# Codec
jpeg-encoder = "0.7"
zune-jpeg = "0.5"
zune-core = "0.5"
openh264 = { version = "0.9", default-features = false, features = ["source"] }

# Storage / config
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "6"
toml = "0.8"

# Security
rand = "0.8"
subtle = "2"

# UI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

# Observability / errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# Utilities
bytes = "1"
crossbeam-channel = "0.5"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
